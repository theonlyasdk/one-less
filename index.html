<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="One Less — your life as a progress bar. 6-month blocks, weeks, days, activities." />
    <title>One Less — life as a progress bar</title>
    <!--
      Paint the page background before the stylesheet is fetched, otherwise dark
      mode flashes white on every load. Kept in step with the tokens in
      src/index.css: `:root` when the OS is light, `:root:not(.light)` when it is
      dark, and `.dark` when the toggle has been used.
    -->
    <style>
      html { background: oklch(1 0 0); }
      @media (prefers-color-scheme: dark) {
        html:not(.light) { background: oklch(0.1448 0 0); }
      }
      html.dark { background: oklch(0.1448 0 0); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
